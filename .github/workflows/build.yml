name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and verify incremental configuration
        run: bash gradlew assemble :fabric:verifySchematic --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: abstool-${{ github.sha }}
          path: |
            26.2Fabric/build/libs/*.jar
            26.2NeoForge/build/libs/*.jar
          if-no-files-found: error
# GPU visual acceptance is performed locally, never inferred from this job.
