name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Mirror wiki directory to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git ls-remote "${WIKI_URL}" >/dev/null 2>&1; then
            echo "::error::The GitHub Wiki repository is not initialized yet. Open the repository's Wiki tab, create an initial Home page once, then rerun this workflow."
            exit 1
          fi

          git clone "${WIKI_URL}" wiki-repo
          rsync -a --delete --exclude=".git/" source/wiki/ wiki-repo/

          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD
