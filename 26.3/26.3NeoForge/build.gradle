plugins { id 'net.neoforged.moddev' }

repositories { maven { url = 'https://api.modrinth.com/maven' } }

dependencies {
    compileOnly 'maven.modrinth:xaeros-world-map:p5t2Xn8F'
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
}

sourceSets {
    verification {
        java.srcDir rootProject.file('common/src/verification/java')
        java.exclude '**/SchematicVerification.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
def verifyWaypoint = tasks.register('verifyWaypoint', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.abyssredemption.abstool.verification.WaypointVerification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    workingDir = layout.buildDirectory.dir('waypoint-verification').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn verifyWaypoint }
if (providers.gradleProperty('xaeroReferenceDir').isPresent()) {
    def referenceDir = file(providers.gradleProperty('xaeroReferenceDir').get())
    tasks.register('verifyXaero', JavaExec) {
        group = 'verification'
        dependsOn tasks.named('verificationClasses')
        classpath = sourceSets.verification.runtimeClasspath
        mainClass = 'com.abyssredemption.abstool.verification.XaeroCompatibilityVerification'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        args fileTree(referenceDir) { include 'xaerominimap-neoforge-*.jar', 'xaeroworldmap-neoforge-*.jar' }.files.sort { it.name }.collect { it.absolutePath }
    }
}

neoForge {
    enable {
        version = rootProject.neo_version
        disableRecompilation = true
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        abstool { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

if (providers.gradleProperty('clientSmoke').isPresent()) {
    neoForge.mods {
        abstool_smoke { sourceSet sourceSets.smoke }
    }
    tasks.named('prepareClientRun') { dependsOn tasks.named('smokeClasses') }
}

// ModDevGradle may leave apostrophes unquoted in Java argument files.
// A checkout such as Ab'sTool otherwise resolves its asset directory as D:\Ab.
tasks.named('prepareClientRun') {
    doLast {
        ['clientRunProgramArgs.txt', 'clientRunVmArgs.txt'].each { name ->
            def argsFile = layout.buildDirectory.file("moddev/${name}").get().asFile
            argsFile.setText(argsFile.readLines('UTF-8').collect { line ->
                line.contains("'") && !line.startsWith('"') ? '"' + line + '"' : line
            }.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}
