plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01'
}

subprojects {
    apply plugin: 'java-library'
    group = rootProject.mod_group_id
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
    base.archivesName = "abstool-${project.name}"
    repositories {
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    if (providers.gradleProperty('clientSmoke').isPresent()) {
        sourceSets {
            smoke {
                java.srcDir rootProject.file('common/src/smoke/java')
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        if (providers.gradleProperty('externalServuxTests').isPresent()) {
            tasks.withType(JavaExec).configureEach {
                systemProperty 'abstool.externalServuxTests', 'true'
            }
        }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
    afterEvaluate {
        def utilities = tasks.register('verifyClientUtilities', JavaExec) {
            group = 'verification'
            dependsOn tasks.named('verificationClasses')
            classpath = sourceSets.verification.runtimeClasspath
            mainClass = 'com.abyssredemption.abstool.verification.ClientUtilitiesVerification'
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            systemProperty 'java.awt.headless', 'true'
            workingDir = layout.buildDirectory.dir('client-utilities-verification').get().asFile
            doFirst { workingDir.mkdirs() }
        }
        tasks.named('check') { dependsOn utilities }
    }
    // IDEs may request wrapper relative to a loader subproject.
    tasks.register('wrapper') {
        group = 'build setup'
        description = 'Generate the shared Gradle Wrapper in the repository root.'
        dependsOn rootProject.tasks.named('wrapper')
    }
}

def verifyXaeroParity = tasks.register('verifyXaeroParity') {
    group = 'verification'
    description = 'Verify both loader JARs ship identical shared waypoint/clipboard code and their loader adapters.'
    dependsOn ':fabric:jar', ':neoforge:jar'
    doLast {
        def shared = []
        ['fabric', 'neoforge'].each { loader ->
            def jar = project(":${loader}").tasks.named('jar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def classes = [:]
                zip.entries().each { entry ->
                    if ((entry.name.startsWith('com/abyssredemption/abstool/client/compat/xaero/')
                            || entry.name.startsWith('com/abyssredemption/abstool/client/waypoint/gui/')
                            || entry.name.startsWith('com/abyssredemption/abstool/client/screenshot/')
                            || entry.name == 'com/abyssredemption/abstool/mixin/ScreenshotClipboardMixin.class') && entry.name.endsWith('.class')) {
                        classes[entry.name] = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    }
                }
                if (classes.isEmpty()) throw new GradleException("Missing shared Xaero classes in ${loader}")
                def config = zip.getEntry('abstool.xaero_compat.mixins.json')
                if (config == null) throw new GradleException("Missing Xaero mixin configuration in ${loader}")
                def json = zip.getInputStream(config).withCloseable { new groovy.json.JsonSlurper().parse(it) }
                if (json.plugin != "com.abyssredemption.abstool.${loader}.compat.xaero.XaeroMapMixinPlugin"
                        || json.package != 'com.abyssredemption.abstool.client.compat.xaero.mixin'
                        || json.client != ['WaypointReaderMixin']) throw new GradleException("Wrong Xaero adapter in ${loader}")
                shared.add(classes)
                def mainMixins = zip.getInputStream(zip.getEntry('abstool.mixins.json')).withCloseable { new groovy.json.JsonSlurper().parse(it) }
                if (!mainMixins.client.contains('ScreenshotClipboardMixin')) throw new GradleException("Missing screenshot clipboard hook in ${loader}")
            }
        }
        if (shared[0].keySet() != shared[1].keySet()
                || shared[0].any { name, bytes -> !java.util.Arrays.equals(bytes, shared[1][name]) }) {
            throw new GradleException('Shared waypoint/clipboard code differs between Fabric and NeoForge')
        }
        logger.lifecycle("Client feature parity verified: ${shared[0].size()} identical waypoint/clipboard classes and both loader adapters")
    }
}
tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build', verifyXaeroParity }
